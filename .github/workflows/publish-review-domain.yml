name: Publish Car Trailers review domain
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/**
      - public/**
      - migrations/**
      - scripts/production-review-config.mjs
      - package.json
      - package-lock.json
      - astro.config.mjs
      - .github/workflows/publish-review-domain.yml
permissions:
  contents: read
concurrency:
  group: car-trailers-review-domain
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          PUBLIC_INDEXING_ENABLED: 'false'
      - name: Prepare review deployment and custom domains
        run: node scripts/production-review-config.mjs
      - name: Apply additive database migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.release.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy website and route both website hostnames
        run: npx wrangler deploy --config wrangler.release.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify public review pages
        run: |
          node --input-type=module <<'NODE'
          const urls=[
            'https://www.car-trailers.com.au/',
            'https://www.car-trailers.com.au/shop/',
            'https://www.car-trailers.com.au/trailers/car-transporter/',
            'https://www.car-trailers.com.au/finance/',
            'https://www.car-trailers.com.au/sitemap/'
          ];
          for(const url of urls){
            let response;
            for(let attempt=1;attempt<=18;attempt++){
              response=await fetch(url,{redirect:'follow',signal:AbortSignal.timeout(20000)}).catch(()=>null);
              if(response?.ok)break;
              await new Promise(resolve=>setTimeout(resolve,5000));
            }
            if(!response?.ok)throw new Error(`Verification failed for ${url}: ${response?.status||'network error'}`);
            console.log(`${response.status} ${url}`);
          }
          NODE
