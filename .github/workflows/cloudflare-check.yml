name: Check Cloudflare connection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/cloudflare-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check credentials and existing trailer resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          const token=process.env.CLOUDFLARE_API_TOKEN?.trim();
          const account=process.env.CLOUDFLARE_ACCOUNT_ID?.trim();
          if(!token || !/^[a-f0-9]{32}$/i.test(account||'')) {
            console.error('Missing API token or invalid Account ID. Check the two repository secrets.');
            process.exit(1);
          }
          const lines=['# Cloudflare connection check','', 'Read-only check. No hosting, databases or DNS records were changed.',''];
          let failed=false;
          async function inspect(label,path,project) {
            try {
              const response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+path,{
                headers:{Authorization:'Bearer '+token},
                signal:AbortSignal.timeout(30000),
                redirect:'error'
              });
              const data=await response.json();
              if(!response.ok || data.success===false) {
                failed=true;
                lines.push(label+': FAILED (HTTP '+response.status+'; API codes '+(data.errors||[]).map(e=>e.code).join(', ')+').');
                return;
              }
              lines.push(label+': OK');
              lines.push(JSON.stringify(project(data.result)));
              lines.push('');
            } catch {
              failed=true;
              lines.push(label+': request failed. No credentials have been printed.');
            }
          }
          await inspect('Worker access','/workers/scripts',rows=>rows.filter(x=>/trailer/i.test(x.id||'')).map(x=>({name:x.id})));
          await inspect('D1 database access','/d1/database?name=car-trailers&per_page=100',rows=>rows.filter(x=>/trailer/i.test(x.name||'')).map(x=>({name:x.name,uuid:x.uuid})));
          await inspect('Workers hostname','/workers/subdomain',row=>({subdomain:row.subdomain}));
          await inspect('Existing trailer custom domains','/workers/domains',rows=>rows.filter(x=>x.hostname==='car-trailers.com.au'||x.hostname==='www.car-trailers.com.au').map(x=>({hostname:x.hostname,service:x.service})));
          lines.push(failed?'One or more checks need attention.':'Connection checks passed. Deployment configuration is the next step.');
          const report=lines.join('\n');
          console.log(report);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,report+'\n');
          if(failed)process.exitCode=1;
          NODE
