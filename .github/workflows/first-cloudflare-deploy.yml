name: Deploy trailer website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/first-cloudflare-deploy.yml]
permissions:
  contents: read
  statuses: write
concurrency:
  group: car-trailers-first-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Mark deployment running
        run: node scripts/first-cloudflare-deploy.mjs status pending
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Prepare dedicated website resources
        run: node scripts/first-cloudflare-deploy.mjs prepare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: node scripts/validate-release.mjs
      - run: npm run build
        env:
          PUBLIC_INDEXING_ENABLED: 'false'
      - name: Apply website database schema
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy website to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify live pages and assets
        run: node scripts/first-cloudflare-deploy.mjs verify
      - name: Publish successful deployment status
        run: node scripts/first-cloudflare-deploy.mjs status success
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish failure status
        if: failure()
        run: node scripts/first-cloudflare-deploy.mjs status failure
        env:
          GITHUB_TOKEN: ${{ github.token }}
