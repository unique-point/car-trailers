name: Deploy configured Cloudflare environment
on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment with the corresponding Cloudflare settings
        required: true
        type: choice
        options: [preview, production]
permissions:
  contents: read
concurrency:
  group: cloudflare-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare confirmed environment configuration
        env:
          CTA_DEPLOY_CONFIG: ${{ vars.CLOUDFLARE_CONFIG_JSON }}
        run: node scripts/deployment-config.mjs
      - run: node scripts/validate-release.mjs
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          PUBLIC_INDEXING_ENABLED: ${{ vars.PUBLIC_INDEXING_ENABLED || 'false' }}
      - name: Apply additive database migrations
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
